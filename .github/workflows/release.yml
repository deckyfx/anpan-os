name: Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    name: Build & upload binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build binaries
        run: bun run build.ts

      - name: Generate SHA256 checksums
        run: |
          cd binaries
          sha256sum anpan-os-linux-x64   > anpan-os-linux-x64.sha256
          sha256sum anpan-os-linux-arm64 > anpan-os-linux-arm64.sha256

      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            ./binaries/anpan-os-linux-x64 \
            ./binaries/anpan-os-linux-arm64 \
            ./binaries/anpan-os-linux-x64.sha256 \
            ./binaries/anpan-os-linux-arm64.sha256 \
            --clobber
