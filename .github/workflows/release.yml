name: Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    name: Build & upload binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build binaries
        run: bun run build.ts

      # Bun cross-compiles the macOS binaries from this Linux runner, so the whole matrix
      # comes out of one job. The bare filename in each .sha256 is deliberate: install.sh
      # reads only the first field, and a path would break `shasum -c` for anyone who runs
      # it by hand.
      - name: Generate SHA256 checksums
        run: |
          cd binaries
          for f in anpan-os-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload binaries to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" ./binaries/anpan-os-* --clobber
